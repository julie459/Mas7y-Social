<!DOCTYPE html>
<html>

<head>
  <title>Mas7y Social</title>
<link rel="stylesheet" href="style.css">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f8f5fb;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 40px;
      background-color: #6a0dad;
      color: white;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 20px;
      padding: 0;
    }

    nav ul li {
      cursor: pointer;
    }
.hero {
  text-align: center;
  padding: 100px 20px;
}

.hero h1 {
  font-size: 42px;
  color: #6a0dad;
}

.hero p {
  max-width: 600px;
  margin: 20px auto;
  color: #555;
  font-size: 18px;
}

.hero button {
  padding: 12px 30px;
  border: none;
  background-color: #6a0dad;
  color: white;
  font-size: 16px;
  border-radius: 5px;
  cursor: pointer;
}

.hero button:hover {
  background-color: #4b0082;
}
.logo {
  font-size: 22px;
  font-weight: bold;
}

.logo span {
  color: #ffd700; /* لمسة ذهبي */
}
  </style>
</head>

<body>
<nav>
  <div class="logo">
    ✝ <span>Mas7y</span> Social
  </div>

  <ul>
    <li>Home</li>
    <li>Community</li>
    <li>Prayer Wall</li>
    <li>Events</li>
    <li>Contact</li>
  </ul>
</nav>
 <section class="hero">

  <div class="hero-text">
    <h1 class="main-title">
  Welcome to <span>Mas7y Social</span>
</h1>
    <p>
      A safe Christian community where you can share prayers,
      connect with believers, and grow in faith together.
    </p>
    <button>Join Now</button>
  </div>

 <div class="hero-images">

  <div class="big-image">
    <img src="img1.jpg" alt="">
  </div>

  <div class="small-images">
    <img src="img2.jpg" alt="">
    <img src="img3.jpg" alt="">
  </div>

</div>
</section>
<script src="script.js"></script>

</body>

</html>
